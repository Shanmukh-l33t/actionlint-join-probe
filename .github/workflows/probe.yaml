name: join-string-probe
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  produce:
    runs-on: ubuntu-latest
    outputs:
      reports: ${{ steps.gen.outputs.reports }}
    steps:
      - id: gen
        run: echo "reports=scan.txt,sbom.json" >> "$GITHUB_OUTPUT"

  consume:
    # Exact reproduction from rhysd/actionlint#768
    needs: produce
    if: ${{ contains(join(needs.produce.outputs.reports), '.txt') }}
    runs-on: ubuntu-latest
    steps:
      - name: string literals
        env:
          R1: ${{ join('literal-string', ',') }}
          R3: ${{ join('literal-string') }}
          R5: ${{ join('ab', '-') }}
        run: echo "R1=$R1 R3=$R3 R5=$R5"
      - name: string step output
        env:
          R2: ${{ join(steps.gen.outputs.reports, ',') }}
        run: echo "R2=$R2"
      - name: array still works
        env:
          R4: ${{ join(fromJSON('["a","b"]'), ',') }}
        run: echo "R4=$R4"
