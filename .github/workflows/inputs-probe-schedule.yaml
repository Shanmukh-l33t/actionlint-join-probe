name: inputs-probe-schedule
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch:
    inputs:
      upload:
        type: boolean
        default: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: event
        run: echo "event=${{ github.event_name }}"
      - name: dump-tojson
        run: echo "toJSON_inputs=${{ toJson(inputs) }}"
      - name: dump-eq-empty
        run: echo "eq_empty=${{ inputs == '' }}"
      - name: dump-eq-null
        run: echo "eq_null=${{ inputs == null }}"
      - name: gate-empty
        if: ${{ inputs == '' }}
        run: echo "GATE inputs == '' evaluated TRUE"
      - name: gate-null
        if: ${{ inputs == null }}
        run: echo "GATE inputs == null evaluated TRUE"
